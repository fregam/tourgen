[project]
name = "tourgen"
version = "0.1.0"
description = "AI house tour generator: Claude plans and checks, Higgsfield animates, ffmpeg assembles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "typer>=0.27",
    "httpx>=0.28",
    "selectolax>=1.0",
    "pillow>=12.3",
    "imagehash>=4.3",
    "opencv-python-headless>=5.0",
    "numpy>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.4",
    "types-pyyaml>=6.0",
    "respx>=0.23",
]

[project.scripts]
tourgen = "tourgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tourgen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",  # Typer uses function calls in argument defaults by design
    "RUF001", "RUF002", "RUF003",  # en dashes and arrows in prose are intentional
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tourgen.core.*", "tourgen.models.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
